services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks: [llmnet]

  translatorllm:
    build: .
    container_name: translatorllm
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_TIMEOUT=180
    depends_on:
      - ollama
    networks: [llmnet]

volumes:
  ollama_models:

networks:
  llmnet:
    external: true
